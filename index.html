<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Menu</title>
    <meta
      name="description"
      content="Simple coffee menu homepage with a navbar and four cards."
    />
    <style>
      :root {
        --bg: #f6f1ea;
        --surface: #ffffff;
        --text: #2f1f16;
        --muted: #6b4f3b;
        --accent: #8b5e3c;
        --accent-dark: #6f4e37;
        --border: #eadfd5;
        --shadow: 0 12px 30px rgba(47, 31, 22, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #fffaf5 0%, var(--bg) 100%);
        color: var(--text);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        width: 100%;
      }

      button {
        font: inherit;
      }

      .container {
        width: min(1100px, calc(100% - 2rem));
        margin: 0 auto;
      }

      .navbar {
        background: rgba(255, 250, 245, 0.95);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
      }

      .navbar__inner {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-size: 1.3rem;
        font-weight: 700;
      }

      .nav-links {
        display: flex;
        gap: 1rem;
      }

      .nav-links a {
        color: var(--muted);
        font-weight: 600;
      }

      .hero {
        padding: 4rem 0 2rem;
      }

      .hero__tag,
      .section-heading__tag {
        margin: 0 0 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--accent);
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2.3rem, 5vw, 4rem);
        line-height: 1.05;
        max-width: 12ch;
      }

      .hero__text {
        margin: 1rem 0 0;
        max-width: 56ch;
        line-height: 1.7;
        color: var(--muted);
      }

      .button,
      .card__button {
        display: inline-block;
        border: none;
        border-radius: 999px;
        padding: 0.9rem 1.4rem;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }

      .button:hover,
      .card__button:hover {
        background: var(--accent-dark);
      }

      .menu {
        padding: 2rem 0 4rem;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 2rem;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 1.25rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .card__image {
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .card__body {
        padding: 1rem;
      }

      .card__body h3 {
        margin: 0;
      }

      .card__price {
        margin: 0.5rem 0 1rem;
        color: var(--muted);
        font-weight: 700;
      }

      .card__button {
        width: 100%;
      }

      .footer {
        border-top: 1px solid var(--border);
        padding: 1rem 0;
      }

      .footer__inner {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .navbar__inner,
        .footer__inner {
          flex-direction: column;
          align-items: flex-start;
        }

        .cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="container navbar__inner">
        <a class="logo" href="#home">CoffeeHouse</a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#home">Home</a>
          <a href="#menu">Menu</a>
        </nav>
      </div>
    </header>

    <main id="home">
      <section class="hero container">
        <p class="hero__tag">Fresh coffee, simple choices</p>
        <h1>Start your day with a cup that fits your mood.</h1>
        <p class="hero__text">
          Explore a small coffee menu with a clean layout, quick navigation, and
          four featured drinks.
        </p>
        <a class="button" href="#menu">Shop Now</a>
      </section>

      <section class="menu container" id="menu">
        <div class="section-heading">
          <p class="section-heading__tag">Featured Products</p>
          <h2>Coffee Menu</h2>
        </div>

        <div class="cards" id="cards"></div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <p>CoffeeHouse</p>
        <p>Simple coffee menu for the homepage.</p>
      </div>
    </footer>

    <script>
      const coffees = [
        {
          name: 'Espresso',
          price: '$3.50',
          image: 'https://placehold.co/600x400/3b2f2f/fff?text=Espresso',
        },
        {
          name: 'Cappuccino',
          price: '$4.25',
          image: 'https://placehold.co/600x400/5c4033/fff?text=Cappuccino',
        },
        {
          name: 'Latte',
          price: '$4.75',
          image: 'https://placehold.co/600x400/6f4e37/fff?text=Latte',
        },
        {
          name: 'Mocha',
          price: '$5.00',
          image: 'https://placehold.co/600x400/8b5e3c/fff?text=Mocha',
        },
      ];

      const cards = document.getElementById('cards');

      cards.innerHTML = coffees
        .map(
          (coffee) => `
            <article class="card">
              <img class="card__image" src="${coffee.image}" alt="${coffee.name}">
              <div class="card__body">
                <h3>${coffee.name}</h3>
                <p class="card__price">${coffee.price}</p>
                <button type="button" class="card__button">View Product</button>
              </div>
            </article>
          `
        )
        .join('');
    </script>
  </body>
</html>
